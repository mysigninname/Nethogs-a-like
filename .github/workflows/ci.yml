name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Build debug version
        run: cargo build --all-features

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: netmonitor-x86_64-linux-gnu

          - target: x86_64-unknown-linux-musl
            artifact: netmonitor-x86_64-linux-musl

          - target: aarch64-unknown-linux-gnu
            artifact: netmonitor-aarch64-linux-gnu

          - target: aarch64-unknown-linux-musl
            artifact: netmonitor-aarch64-linux-musl

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            musl-tools \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [[ "${{ matrix.target }}" == *"-musl" ]]; then
            cross build \
              --release \
              --target "${{ matrix.target }}"
          else
            cross build \
              --release \
              --target "${{ matrix.target }}"
          fi

      - name: Rename binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/netmonitor" \
             "dist/${{ matrix.artifact }}"
          strip "dist/${{ matrix.artifact }}" || true
          chmod +x "dist/${{ matrix.artifact }}"

      - name: Create checksum
        working-directory: dist
        run: sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  package:
    name: Package release files
    needs:
      - check
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v5
        with:
          path: release

      - name: Create release archive
        run: |
          mkdir -p packaged

          for directory in release/*; do
            name="$(basename "$directory")"
            tar -czf "packaged/${name}.tar.gz" \
              -C "$directory" .
          done

          sha256sum packaged/* > packaged/SHA256SUMS

      - name: Upload packaged releases
        uses: actions/upload-artifact@v4
        with:
          name: netmonitor-release-packages
          path: packaged/

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - package
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download packaged releases
        uses: actions/download-artifact@v5
        with:
          name: netmonitor-release-packages
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
